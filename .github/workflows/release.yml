# Sign, archive, and upload "Within" (com.shayma.within) to App Store Connect / TestFlight.
# Triggered by the iOS Release Manager (gh workflow run release.yml). macOS runners bill
# at 10x minutes — do not trigger until all four secrets below exist and the App Store
# Connect app record for com.shayma.within has been created, or the run fails on arrival.
#
# Signing approach: cloud-managed automatic signing. xcodebuild authenticates to App
# Store Connect with an API key (-allowProvisioningUpdates + -authenticationKey* flags)
# and creates/downloads the Apple Distribution certificate and App Store provisioning
# profile itself. No .p12 certificate or .mobileprovision secret is needed.
#
# Upload approach: native `xcodebuild -exportArchive` with `destination: upload` in
# ExportOptions.plist (the same path Xcode Organizer uses). Chosen over fastlane pilot
# (Ruby gem drift, extra setup) and `xcrun altool` (deprecated for App Store uploads).
# The archive is exported twice from the same .xcarchive: first to disk (destination:
# export) so the .ipa can be security-scanned and saved as an artifact, then uploaded
# (destination: upload) only after the security gate passes.
#
# Required secrets (create via `gh secret set NAME` or Settings > Secrets and variables >
# Actions — never commit any of these to the repo, never paste them into chat):
#   ASC_KEY_ID      # App Store Connect API key ID (10 chars, shown when key is created)
#   ASC_ISSUER_ID   # App Store Connect issuer ID (UUID, top of the API keys page)
#   ASC_KEY_P8      # full contents of the downloaded AuthKey_<KEYID>.p8 (raw or base64)
#   APPLE_TEAM_ID   # 10-char Apple Developer Team ID (developer.apple.com > Membership)
#
# Exact commands (run from the repo root, with the .p8 saved locally OUTSIDE the repo):
#   gh secret set ASC_KEY_ID    --body "XXXXXXXXXX"
#   gh secret set ASC_ISSUER_ID --body "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
#   gh secret set ASC_KEY_P8    < /path/to/AuthKey_XXXXXXXXXX.p8
#   gh secret set APPLE_TEAM_ID --body "XXXXXXXXXX"

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (CFBundleShortVersionString)"
        required: false
        default: "1.0"
      build_number:
        description: "Build number override (default: this workflow's run number)"
        required: false
        default: ""

jobs:
  archive-and-upload:
    # macos-26 ships Xcode 26 (iOS 26 SDK). Apple requires the iOS 26 SDK for all
    # App Store Connect / TestFlight uploads as of 2025-04; macos-15's Xcode 16 (iOS 18
    # SDK) is rejected at upload validation.
    runs-on: macos-26
    timeout-minutes: 60

    env:
      PROJECT: EscapeRoom/EscapeRoom.xcodeproj
      SCHEME: EscapeRoom
      ARCHIVE_PATH: build/Within.xcarchive
      EXPORT_PATH: build/export

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK required for App Store upload)
        run: |
          set -euo pipefail
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$XC" ]; then
            echo "::error::No Xcode 26 found on the runner. Available: $(ls -d /Applications/Xcode_*.app 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Preflight - fail fast if secrets are missing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "$ASC_KEY_ID" ]    || MISSING="$MISSING ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || MISSING="$MISSING ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ]    || MISSING="$MISSING ASC_KEY_P8"
          [ -n "$APPLE_TEAM_ID" ] || MISSING="$MISSING APPLE_TEAM_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing GitHub Secrets:$MISSING — see the header of release.yml for gh secret set commands."
            exit 1
          fi
          xcodebuild -version

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          # Accept the secret as raw .p8 text or base64-encoded.
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$ASC_KEY_P8" | base64 -d > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Resolve version and build number
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          BUILD="${{ github.event.inputs.build_number }}"
          [ -n "$BUILD" ] || BUILD="${{ github.run_number }}"
          echo "MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "Releasing version $VERSION ($BUILD)"

      - name: Archive (device, cloud-managed signing)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # The app's Info.plist pins CFBundleVersion to a literal ("1"), so the archive-time
      # CURRENT_PROJECT_VERSION override does NOT reach the built app — every upload came
      # out as build "1" and App Store Connect rejects duplicates. Stamp the real build
      # number (and marketing version) directly into the archived app's Info.plist before
      # export. manageAppVersionAndBuildNumber=false in the export plists preserves this;
      # export re-signs the app, so the edited plist is carried into the signed .ipa.
      - name: Stamp build number into the archive
        run: |
          set -euo pipefail
          APP=$(ls -d "$ARCHIVE_PATH"/Products/Applications/*.app | head -n1)
          PLIST="$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" "$PLIST"
          # exportArchive reads the version from the archive's OWN metadata
          # (ApplicationProperties in the .xcarchive Info.plist), not just the app binary —
          # stamp that too, or the delivery still carries the stale build "1".
          ARCH_PLIST="$ARCHIVE_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:CFBundleVersion $BUILD_NUMBER" "$ARCH_PLIST"
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:CFBundleShortVersionString $MARKETING_VERSION" "$ARCH_PLIST"
          echo "Stamped $(basename "$APP") + archive metadata: version $MARKETING_VERSION, build $BUILD_NUMBER"
          echo "app CFBundleVersion:     $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          echo "archive CFBundleVersion: $(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' "$ARCH_PLIST")"

      - name: Export .ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > build/ExportOptions-export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist build/ExportOptions-export.plist \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$EXPORT_PATH"

      # Release Manager security re-check (final gate before upload; blocking).
      # 1. No development-time secrets anywhere in the signed payload.
      # 2. Entitlements are minimal — this game uses none of camera/mic/location/contacts.
      - name: Security re-check (secrets scan + entitlements audit)
        run: |
          set -euo pipefail
          IPA=$(ls "$EXPORT_PATH"/*.ipa | head -n1)
          echo "Scanning $IPA"
          mkdir -p build/scan
          unzip -q "$IPA" -d build/scan
          APP=$(ls -d build/scan/Payload/*.app | head -n1)
          FAIL=0

          # --- 1a. Key-bearing / config files that must never ship ---
          BADFILES=$(find build/scan -name "*.p8" -o -name "*.p12" -o -name "*.pem" \
                       -o -name "*.env" -o -name ".env*" -o -name "*.netrc" || true)
          if [ -n "$BADFILES" ]; then
            echo "::error::Key-bearing/config files found in .ipa payload:"; echo "$BADFILES"; FAIL=1
          fi

          # --- 1b. Secret-looking strings in every file of the payload (binaries included) ---
          PATTERNS='FAL_KEY|fal\.ai|fal-[A-Za-z0-9]{16,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|github_pat_|BEGIN [A-Z ]*PRIVATE KEY|api[_-]?key[\"'"'"': ]+[A-Za-z0-9_\-]{16,}'
          HITS=$(grep -REno --binary-files=text "$PATTERNS" build/scan/Payload || true)
          if [ -n "$HITS" ]; then
            echo "::error::Potential development-time secrets found in .ipa payload:"
            echo "$HITS" | head -n 40
            FAIL=1
          fi

          # --- 2a. Entitlements must stay within the automatic-signing baseline ---
          codesign -d --entitlements - "$APP" > build/scan/entitlements.txt 2>/dev/null || \
            codesign -d --entitlements :- "$APP" > build/scan/entitlements.txt
          echo "--- signed entitlements ---"; cat build/scan/entitlements.txt
          UNEXPECTED=$(grep -Eo '(com\.apple\.[A-Za-z0-9._-]+|application-identifier|get-task-allow|beta-reports-active|keychain-access-groups|aps-environment)' build/scan/entitlements.txt \
            | sort -u \
            | grep -Ev '^(application-identifier|com\.apple\.developer\.team-identifier|get-task-allow|beta-reports-active|keychain-access-groups)$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected entitlements in signed app (baseline allows only app/team identifier, get-task-allow, beta-reports-active, keychain-access-groups):"
            echo "$UNEXPECTED"; FAIL=1
          fi

          # --- 2b. No permission usage-description keys (camera/mic/location/contacts etc.) ---
          USAGE=$(plutil -p "$APP/Info.plist" | grep -E 'NS[A-Za-z]+UsageDescription' || true)
          if [ -n "$USAGE" ]; then
            echo "::error::Permission usage-description keys found — this game requests no device permissions:"
            echo "$USAGE"; FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::SECURITY GATE FAILED — upload blocked. Route back to the Producer."
            exit 1
          fi
          echo "Security re-check passed: no secrets in payload, entitlements minimal, no permission requests."

      - name: Upload to App Store Connect (TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > build/ExportOptions-upload.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist build/ExportOptions-upload.plist \
            -exportPath build/upload \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build $MARKETING_VERSION ($BUILD_NUMBER) — it will appear in TestFlight after Apple's processing pass (typically 5-30 minutes)."

      - name: Upload .ipa, entitlements dump, and logs as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            build/export/*.ipa
            build/scan/entitlements.txt
            build/*.xcarchive/Info.plist
          if-no-files-found: warn
