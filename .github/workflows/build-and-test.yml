# Build & simulator-test the escape room app on a macOS runner.
#
# TWO-LANE CI (user-approved efficiency split, 2026-07-21):
#
#   * FAST lane (`fast-lane` job) — runs on EVERY push (any branch) + every workflow_dispatch.
#     Build + the full unit/logic suite for ALL levels (PuzzleEngineTests, QALevelFlowTests,
#     Level2Tests, Level2AssetStagingTests, the RenderedFrameOverlayTests registration guard,
#     and — the real M1-class safety net — Level2RegistrationTests: the static overlay<->hotspot
#     REGISTRATION guard + player-style visual-tap geometry + example-ordering completability).
#     NO slow simulator UI playthroughs. This is the per-iteration gate; target ~10-20 min.
#     Deterministic + cheap, so a fix batch validates fast instead of waiting on a ~75-min
#     iPad UI playthrough.
#
#   * FULL lane (`full-lane-ui` job) — runs ONLY on push to `main` OR a manual
#     workflow_dispatch with input `lane=full`. Everything the fast lane does PLUS the heavy
#     cross-level ON-DEVICE UI regression (the ~75-min L1 iPad full playthrough + the L1/L2
#     iPhone-SE playthrough/smoke + the Dynamic-Island safe-area shots). This is the
#     pre-merge / pre-release gate. The single flaky, capacity-bound iPad full-playthrough
#     step is marked `continue-on-error` (documented simulator-starvation UI-query/terminate
#     flakiness) so a transient iPad flake cannot hold a batch hostage; the reliable
#     iPhone-SE + DI UI steps remain hard gates.
#
# A failed step still fails its lane (`set -o pipefail`; no `|| true` on real build/test
# commands) except where `continue-on-error` is explicitly set on the known-flaky iPad UI step.
#
# Device matrix covers the QA test-matrix floor (specs/global-ui-style.md Section 11):
# 12.9 inch iPad + smallest supported iPhone + a notch/Dynamic-Island device.

name: Build and Test

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Which lane to run (fast = build+unit only; full = + on-device UI regression)"
        type: choice
        options: [fast, full]
        default: fast
  push:
    branches: ["**"]
    paths:
      - "EscapeRoom/**"
      - ".github/workflows/build-and-test.yml"

jobs:
  # ------------------------------------------------------------------------------------------
  # FAST lane: build + full unit/logic suite (all levels) + the static registration/geometry
  # guards. No simulator UI playthroughs. Blocking on every push.
  # ------------------------------------------------------------------------------------------
  fast-lane:
    runs-on: macos-15          # macOS runners bill at 10x minutes on private repos
    timeout-minutes: 60        # build + 3 device unit runs; typically ~15-20 min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Show available simulator devices (debug aid)
        run: xcrun simctl list devices available

      - name: Resolve simulator destinations
        id: sims
        run: |
          set -euo pipefail
          ALL_DEVICES=$(xcrun simctl list devices available)

          IPAD_NAME=$(echo "$ALL_DEVICES" | grep -Eo 'iPad Pro 13-inch \([^)]*\)' | head -n1 || true)
          if [ -z "${IPAD_NAME:-}" ]; then
            IPAD_NAME=$(echo "$ALL_DEVICES" | grep -Eo 'iPad Pro [0-9.]+-inch \([^)]*\)' | head -n1 || true)
          fi
          if [ -z "${IPAD_NAME:-}" ]; then IPAD_NAME="iPad Pro 13-inch (M4)"; fi
          echo "ipad_name=$IPAD_NAME" >> "$GITHUB_OUTPUT"

          IPHONE_NAME=$(echo "$ALL_DEVICES" | grep -Eo 'iPhone SE \([0-9a-zA-Z ]*generation\)' | head -n1 || true)
          if [ -z "${IPHONE_NAME:-}" ]; then IPHONE_NAME="iPhone SE (3rd generation)"; fi
          echo "iphone_name=$IPHONE_NAME" >> "$GITHUB_OUTPUT"

          IPHONE_DI_NAME=""
          for CAND in "iPhone 16 Pro" "iPhone 16" "iPhone 15 Pro" "iPhone 15"; do
            if echo "$ALL_DEVICES" | grep -q "    $CAND ("; then IPHONE_DI_NAME="$CAND"; break; fi
          done
          if [ -z "${IPHONE_DI_NAME:-}" ]; then IPHONE_DI_NAME="iPhone 16"; fi
          echo "iphone_di_name=$IPHONE_DI_NAME" >> "$GITHUB_OUTPUT"

          echo "Resolved iPad destination: $IPAD_NAME"
          echo "Resolved iPhone destination: $IPHONE_NAME"
          echo "Resolved Dynamic Island destination: $IPHONE_DI_NAME"

      - name: Diagnose project/scheme (debug aid)
        run: |
          xcodebuild -project EscapeRoom/EscapeRoom.xcodeproj -list
          xcodebuild -project EscapeRoom/EscapeRoom.xcodeproj -scheme EscapeRoom -showdestinations || true

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project EscapeRoom/EscapeRoom.xcodeproj \
            -scheme EscapeRoom \
            -destination "platform=iOS Simulator,name=${{ steps.sims.outputs.ipad_name }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Unit tests - iPad 13-inch class
        run: |
          set -o pipefail
          mkdir -p TestResults
          xcodebuild test \
            -project EscapeRoom/EscapeRoom.xcodeproj \
            -scheme EscapeRoom \
            -destination "platform=iOS Simulator,name=${{ steps.sims.outputs.ipad_name }}" \
            -resultBundlePath TestResults/EscapeRoom-iPad.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Unit tests - smallest supported iPhone
        run: |
          set -o pipefail
          xcodebuild test \
            -project EscapeRoom/EscapeRoom.xcodeproj \
            -scheme EscapeRoom \
            -destination "platform=iOS Simulator,name=${{ steps.sims.outputs.iphone_name }}" \
            -resultBundlePath TestResults/EscapeRoom-iPhone.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Unit tests - Dynamic Island iPhone
        run: |
          set -o pipefail
          xcodebuild test \
            -project EscapeRoom/EscapeRoom.xcodeproj \
            -scheme EscapeRoom \
            -destination "platform=iOS Simulator,name=${{ steps.sims.outputs.iphone_di_name }}" \
            -resultBundlePath TestResults/EscapeRoom-iPhoneDI.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Upload fast-lane results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-fast
          path: TestResults/
          if-no-files-found: warn

  # ------------------------------------------------------------------------------------------
  # FULL lane: the heavy on-device UI regression. Runs ONLY on push to main OR a manual
  # dispatch with lane=full. Depends on the fast lane (no point running a ~75-min UI suite if
  # the logic is red). The capacity-bound iPad full-playthrough step is `continue-on-error`.
  # ------------------------------------------------------------------------------------------
  full-lane-ui:
    needs: fast-lane
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.lane == 'full')
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Resolve simulator destinations
        id: sims
        run: |
          set -euo pipefail
          ALL_DEVICES=$(xcrun simctl list devices available)

          IPAD_NAME=$(echo "$ALL_DEVICES" | grep -Eo 'iPad Pro 13-inch \([^)]*\)' | head -n1 || true)
          if [ -z "${IPAD_NAME:-}" ]; then
            IPAD_NAME=$(echo "$ALL_DEVICES" | grep -Eo 'iPad Pro [0-9.]+-inch \([^)]*\)' | head -n1 || true)
          fi
          if [ -z "${IPAD_NAME:-}" ]; then IPAD_NAME="iPad Pro 13-inch (M4)"; fi
          echo "ipad_name=$IPAD_NAME" >> "$GITHUB_OUTPUT"

          IPHONE_NAME=$(echo "$ALL_DEVICES" | grep -Eo 'iPhone SE \([0-9a-zA-Z ]*generation\)' | head -n1 || true)
          if [ -z "${IPHONE_NAME:-}" ]; then IPHONE_NAME="iPhone SE (3rd generation)"; fi
          echo "iphone_name=$IPHONE_NAME" >> "$GITHUB_OUTPUT"

          IPHONE_DI_NAME=""
          for CAND in "iPhone 16 Pro" "iPhone 16" "iPhone 15 Pro" "iPhone 15"; do
            if echo "$ALL_DEVICES" | grep -q "    $CAND ("; then IPHONE_DI_NAME="$CAND"; break; fi
          done
          if [ -z "${IPHONE_DI_NAME:-}" ]; then IPHONE_DI_NAME="iPhone 16"; fi
          echo "iphone_di_name=$IPHONE_DI_NAME" >> "$GITHUB_OUTPUT"

      # UI tests (QA test-infrastructure request 1): scripted full playthrough with per-view
      # screenshots as xcresult attachments.
      #
      # NOTE (M2, Level 2): the iPhone-SE UI step runs the WHOLE EscapeRoomUITests scheme
      # including the Level2UITests class (L2 menu/entry/z1-pickups-incl-coat-fix/close-ups/
      # navigation/pause smoke + L2 composition guard); the Dynamic-Island step runs the L2
      # composition guard. The iPad UI step SKIPS Level2UITests (its heavy full-solve L1 tests
      # already sit at the runner's simulator-starvation capacity — L2's iPad coverage is the
      # fast, reliable unit-level Level2RegistrationTests + Level2Tests in the fast lane).
      - name: UI tests - smallest supported iPhone (full playthrough + smoke + save-resume)
        run: |
          set -o pipefail
          xcodebuild test \
            -project EscapeRoom/EscapeRoom.xcodeproj \
            -scheme EscapeRoomUITests \
            -destination "platform=iOS Simulator,name=${{ steps.sims.outputs.iphone_name }}" \
            -resultBundlePath TestResults/EscapeRoomUITests-iPhone.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      # iPad (PRIMARY device) full L1 playthrough. This single ~75-min step is the documented
      # simulator-starvation flake surface (UI-query timeout / "Failed to terminate" across
      # runs), so it is NON-BLOCKING (`continue-on-error`) — a transient iPad flake reports but
      # does not fail the run. Level2UITests is skipped here (see note above); the R6009 L1
      # poker-lifecycle heavyweights are gated to the iPhone-SE UI step.
      - name: UI tests - iPad (full playthrough + smoke + save-resume) [non-blocking]
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project EscapeRoom/EscapeRoom.xcodeproj \
            -scheme EscapeRoomUITests \
            -destination "platform=iOS Simulator,name=${{ steps.sims.outputs.ipad_name }}" \
            -skip-testing:EscapeRoomUITests/EscapeRoomUITests/testR6009_pokerSurvivesBarrelBeforeAsh \
            -skip-testing:EscapeRoomUITests/EscapeRoomUITests/testR6009_pokerSurvivesAstrolabeFirst \
            -skip-testing:EscapeRoomUITests/Level2UITests \
            -resultBundlePath TestResults/EscapeRoomUITests-iPad.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: UI tests - Dynamic Island iPhone (safe-area screenshots)
        run: |
          set -o pipefail
          xcodebuild test \
            -project EscapeRoom/EscapeRoom.xcodeproj \
            -scheme EscapeRoomUITests \
            -only-testing:EscapeRoomUITests/EscapeRoomUITests/testMenuAndNavigationSmoke \
            -only-testing:EscapeRoomUITests/EscapeRoomUITests/testSceneContentFillsScreen_QA_B3_001 \
            -only-testing:EscapeRoomUITests/Level2UITests/testL2SceneContentFillsScreen \
            -destination "platform=iOS Simulator,name=${{ steps.sims.outputs.iphone_di_name }}" \
            -resultBundlePath TestResults/EscapeRoomUITests-iPhoneDI.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Upload full-lane UI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-full-ui
          path: TestResults/
          if-no-files-found: warn
