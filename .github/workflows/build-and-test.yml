# Build & simulator-test the escape room app on a macOS runner.
# Triggered by the Developer Agent (gh workflow run build-and-test.yml) after pushing
# the Xcode project; the QA Agent reads results via gh run download.
#
# PLACEHOLDER: the xcodebuild/simctl steps below are stubs. Fill in the real scheme,
# project path, and destinations once the Xcode project exists in this repo.

name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "EscapeRoom/**"        # TODO: adjust to the actual Xcode project directory
      - ".github/workflows/build-and-test.yml"

jobs:
  build-and-test:
    runs-on: macos-15          # macOS runners bill at 10x minutes on private repos
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          # TODO: pin the Xcode version once the project's toolchain is decided
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

