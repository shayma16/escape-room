# Build & simulator-test the escape room app on a macOS runner.
# Triggered by the Developer Agent (gh workflow run build-and-test.yml) after pushing
# the Xcode project; the QA Agent reads results via gh run download.
#
# Device matrix covers the QA test-matrix floor from
# specs/global-ui-style.md Section 11: 12.9 inch iPad + smallest supported iPhone.
# A failed job here means the level is not buildable - steps are NOT allowed to
# silently swallow failures (no trailing `|| true` on the actual build/test commands);
# `set -o pipefail` ensures a failing xcodebuild fails the step even when piped through
# xcpretty for readability.

name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "EscapeRoom/**"
      - ".github/workflows/build-and-test.yml"

jobs:
  build-and-test:
    runs-on: macos-15          # macOS runners bill at 10x minutes on private repos
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          # Intentionally NOT pinning a specific /Applications/Xcode_*.app here: side-
          # installed Xcode versions on macos-15 runners can be missing their iOS
          # Simulator platform support (observed: xcodebuild -showdestinations returned
          # zero simulator destinations, only an ineligible "iOS 18.2 is not installed"
          # device placeholder, when pinned to Xcode 16.2 explicitly). The runner's
          # default `xcodebuild` has the platform support pre-cached and matching the
          # preinstalled simulator runtimes reported by `xcrun simctl list`.
          xcodebuild -version
          xcode-select -p

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Show available simulator devices (debug aid)
        run: xcrun simctl list devices available

      - name: Resolve simulator destinations
        id: sims
        run: |
          set -euo pipefail
          ALL_DEVICES=$(xcrun simctl list devices available)

          IPAD_NAME=$(echo "$ALL_DEVICES" | grep -Eo 'iPad Pro 13-inch \([^)]*\)' | head -n1 || true)
          if [ -z "${IPAD_NAME:-}" ]; then
            IPAD_NAME=$(echo "$ALL_DEVICES" | grep -Eo 'iPad Pro [0-9.]+-inch \([^)]*\)' | head -n1 || true)
          fi
          if [ -z "${IPAD_NAME:-}" ]; then IPAD_NAME="iPad Pro 13-inch (M4)"; fi
          echo "ipad_name=$IPAD_NAME" >> "$GITHUB_OUTPUT"

          IPHONE_NAME=$(echo "$ALL_DEVICES" | grep -Eo 'iPhone SE \([0-9a-zA-Z ]*generation\)' | head -n1 || true)
          if [ -z "${IPHONE_NAME:-}" ]; then IPHONE_NAME="iPhone SE (3rd generation)"; fi
          echo "iphone_name=$IPHONE_NAME" >> "$GITHUB_OUTPUT"

          # Notch/Dynamic Island device for safe-area verification
          # (global-ui-style.md Section 11; QA test-infrastructure request 2).
          IPHONE_DI_NAME=""
          for CAND in "iPhone 16 Pro" "iPhone 16" "iPhone 15 Pro" "iPhone 15"; do
            if echo "$ALL_DEVICES" | grep -q "    $CAND ("; then IPHONE_DI_NAME="$CAND"; break; fi
          done
          if [ -z "${IPHONE_DI_NAME:-}" ]; then IPHONE_DI_NAME="iPhone 16"; fi
          echo "iphone_di_name=$IPHONE_DI_NAME" >> "$GITHUB_OUTPUT"

          echo "Resolved iPad destination: $IPAD_NAME"
          echo "Resolved iPhone destination: $IPHONE_NAME"
          echo "Resolved Dynamic Island destination: $IPHONE_DI_NAME"

      - name: Diagnose project/scheme (debug aid)
        run: |
          xcodebuild -project EscapeRoom/EscapeRoom.xcodeproj -list
          xcodebuild -project EscapeRoom/EscapeRoom.xcodeproj -scheme EscapeRoom -showdestinations || true

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project EscapeRoom/EscapeRoom.xcodeproj \
            -scheme EscapeRoom \
            -destination "platform=iOS Simulator,name=${{ steps.sims.outputs.ipad_name }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Unit tests - iPad 13-inch class
        run: |
          set -o pipefail
          mkdir -p TestResults
          xcodebuild test \
            -project EscapeRoom/EscapeRoom.xcodeproj \
            -scheme EscapeRoom \
            -destination "platform=iOS Simulator,name=${{ steps.sims.outputs.ipad_name }}" \
            -resultBundlePath TestResults/EscapeRoom-iPad.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Unit tests - smallest supported iPhone
        run: |
          set -o pipefail
          xcodebuild test \
            -project EscapeRoom/EscapeRoom.xcodeproj \
            -scheme EscapeRoom \
            -destination "platform=iOS Simulator,name=${{ steps.sims.outputs.iphone_name }}" \
            -resultBundlePath TestResults/EscapeRoom-iPhone.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Unit tests - Dynamic Island iPhone
        run: |
          set -o pipefail
          xcodebuild test \
            -project EscapeRoom/EscapeRoom.xcodeproj \
            -scheme EscapeRoom \
            -destination "platform=iOS Simulator,name=${{ steps.sims.outputs.iphone_di_name }}" \
            -resultBundlePath TestResults/EscapeRoom-iPhoneDI.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      # UI tests (QA test-infrastructure request 1): scripted full playthrough with
      # per-view screenshots as xcresult attachments. Full playthrough runs on
      # iPhone-class devices; it self-skips on iPad until the QA-BUG-004 re-framed
      # plates land (menu/navigation smoke still runs there).
      - name: UI tests - smallest supported iPhone (full playthrough + screenshots)
        run: |
          set -o pipefail
          xcodebuild test \
            -project EscapeRoom/EscapeRoom.xcodeproj \
            -scheme EscapeRoomUITests \
            -destination "platform=iOS Simulator,name=${{ steps.sims.outputs.iphone_name }}" \
            -resultBundlePath TestResults/EscapeRoomUITests-iPhone.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: UI tests - iPad (smoke; playthrough auto-skips pending BUG-004 art)
        run: |
          set -o pipefail
          xcodebuild test \
            -project EscapeRoom/EscapeRoom.xcodeproj \
            -scheme EscapeRoomUITests \
            -destination "platform=iOS Simulator,name=${{ steps.sims.outputs.ipad_name }}" \
            -resultBundlePath TestResults/EscapeRoomUITests-iPad.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: UI tests - Dynamic Island iPhone (safe-area screenshots)
        run: |
          set -o pipefail
          xcodebuild test \
            -project EscapeRoom/EscapeRoom.xcodeproj \
            -scheme EscapeRoomUITests \
            -only-testing:EscapeRoomUITests/EscapeRoomUITests/testMenuAndNavigationSmoke \
            -destination "platform=iOS Simulator,name=${{ steps.sims.outputs.iphone_di_name }}" \
            -resultBundlePath TestResults/EscapeRoomUITests-iPhoneDI.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn
